name: Windows dashboard stable token probe

# Temporary, fork-only check for #447 (not part of the PR): runs the Windows
# owner-only ACL tests for the dashboard's stable token file on a real Windows
# host, then starts the real `--serve` binary with a token file and checks the
# API accepts it, and refuses it once other users can read the file.
on:
  push:
    branches: [ci/windows-token-447]
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Stub frontend build output
        # tauri::generate_context! and rust-embed need ../dist; the probe only
        # exercises /api, so a placeholder page is enough.
        run: |
          New-Item -ItemType Directory -Force packages/dashboard/dist | Out-Null
          Set-Content packages/dashboard/dist/index.html '<!doctype html><title>probe</title>'

      - name: whoami / elevation
        run: |
          whoami /user
          whoami /groups | Select-String -Pattern "Administrators|Mandatory Label"
          icacls $env:TEMP

      - name: Clippy (no warnings in the code this branch touches)
        # The crate has pre-existing Windows-only lints (unused test imports,
        # a dead test helper, an unused parameter), so the whole crate is not
        # -D warnings clean on Windows upstream. Check the files this branch
        # touches instead: cargo's exit code is ignored, a warning naming them
        # fails the step.
        working-directory: packages/dashboard/src-tauri
        run: |
          cargo clippy --lib --tests --message-format short 2>&1 | Tee-Object clippy.log | Out-Null
          $bad = Get-Content clippy.log | Select-String -Pattern '^src\\serve\\(token_file|mod)\.rs.*(warning|error)'
          Get-Content clippy.log | Select-String -Pattern '^src\\(serve|config|commands)\\.*rs' | Select-Object -First 20
          if ($bad) { Write-Host "warnings in serve/:"; $bad; exit 1 }
          Write-Host "serve/ is warning-free"

      - name: Unit tests (serve::token_file, serve::tests)
        working-directory: packages/dashboard/src-tauri
        run: "cargo test --lib serve:: -- --nocapture --test-threads=1"

      - name: Build binary
        working-directory: packages/dashboard/src-tauri
        run: cargo build

      - name: End-to-end with the real binary
        working-directory: packages/dashboard/src-tauri
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = (Resolve-Path target/debug/magic-context-dashboard.exe).Path
          $data = Join-Path $env:USERPROFILE "mc-probe-data"
          $dir = Join-Path $data "cortexkit\magic-context"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $file = Join-Path $dir "dashboard-token"
          $env:XDG_DATA_HOME = $data

          $bytes = New-Object byte[] 32
          [Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($bytes)
          $token = -join ($bytes | ForEach-Object { $_.ToString('x2') })
          Set-Content -NoNewline -Encoding ascii $file $token

          function Probe([string]$label, [int]$port, [string]$bearer) {
            $out = Join-Path $env:RUNNER_TEMP "$label.out"
            $err = Join-Path $env:RUNNER_TEMP "$label.err"
            $p = Start-Process -FilePath $bin -ArgumentList "--serve", "$port" -PassThru `
              -RedirectStandardOutput $out -RedirectStandardError $err -NoNewWindow
            $status = $null
            for ($i = 0; $i -lt 60 -and $null -eq $status; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                # get_db_health answers without a database, so the status code
                # reports the token decision alone: 200 for an accepted file and
                # 401 for a refused one. list_workspaces would open SQLite and
                # answer 400 on a runner with no database, hiding the difference.
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:$port/api/invoke" -Method Post `
                  -Headers @{ Authorization = "Bearer $bearer" } -ContentType 'application/json' `
                  -Body '{"cmd":"get_db_health","args":{}}' -SkipHttpErrorCheck
                $status = [int]$r.StatusCode
              } catch { }
            }
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep -Milliseconds 300
            $stdout = Get-Content -Raw $out -ErrorAction SilentlyContinue
            $stderr = Get-Content -Raw $err -ErrorAction SilentlyContinue
            Write-Host "[$label] http=$status"
            Write-Host "[$label] stdout: $stdout"
            Write-Host "[$label] stderr: $stderr"
            $leaked = ("$stdout$stderr").Contains($token)
            return @{ Status = $status; Leaked = $leaked; Stderr = "$stderr" }
          }

          Write-Host "--- token file ACL as created under the profile ---"
          icacls $file

          $good = Probe "good" 19077 $token
          if ($good.Status -ne 200) { throw "owner-only file: expected 200, got $($good.Status)" }
          if ($good.Leaked) { throw "stable token was printed" }

          icacls $file /grant "*S-1-1-0:(R)" | Out-Host
          icacls $file
          $open = Probe "everyone-read" 19078 $token
          if ($open.Status -ne 401) { throw "Everyone-readable file: expected 401, got $($open.Status)" }
          if (-not $open.Stderr.Contains("other users")) { throw "missing warning for Everyone-readable file" }

          Remove-Item $file
          $missing = Probe "missing" 19079 $token
          if ($missing.Status -ne 401) { throw "no file: expected 401, got $($missing.Status)" }
          Write-Host "E2E OK: 200 with owner-only file, 401 when Everyone can read it, 401 without a file; token never printed"

  probe-non-elevated:
    # The runner account is an elevated administrator. Run the same tests as a
    # fresh standard user, where `icacls /setowner` fails, to show the
    # foreign-owner test skips instead of failing and the rest still pass.
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Stub frontend build output
        run: |
          New-Item -ItemType Directory -Force packages/dashboard/dist | Out-Null
          Set-Content packages/dashboard/dist/index.html '<!doctype html><title>probe</title>'
      - name: Build the test binary
        working-directory: packages/dashboard/src-tauri
        run: |
          cargo test --lib --no-run 2>&1 | Tee-Object build.log
          $line = Get-Content build.log | Select-String -Pattern 'Executable unittests src[\\/]lib\.rs \((.+)\)' | Select-Object -First 1
          if (-not $line) { throw "test binary not found" }
          $exe = (Resolve-Path $line.Matches[0].Groups[1].Value).Path
          "TEST_EXE=$exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: "Run serve:: tests as a standard user"
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "mcprobe"
          $plain = "Mc!" + [guid]::NewGuid().ToString("N").Substring(0, 16)
          $pw = ConvertTo-SecureString $plain -AsPlainText -Force
          New-LocalUser -Name $name -Password $pw -PasswordNeverExpires | Out-Null
          Add-LocalGroupMember -Group "Users" -Member $name -ErrorAction SilentlyContinue
          $cred = New-Object System.Management.Automation.PSCredential("$env:COMPUTERNAME\$name", $pw)
          $work = "C:\mcprobe-work"
          New-Item -ItemType Directory -Force $work | Out-Null
          # Owner-only like a user profile: C:\ grants Users read, which new
          # files would inherit and the token check rightly refuses.
          icacls $work /inheritance:r /grant:r "${name}:(OI)(CI)F" "*S-1-5-18:(OI)(CI)F" "*S-1-5-32-544:(OI)(CI)F" | Out-Null
          icacls $work
          # Run the binary in place (it may load DLLs from target/), readable by
          # the new user; its temp files go to a directory it owns.
          icacls $env:GITHUB_WORKSPACE /grant "${name}:(OI)(CI)RX" /T /Q | Out-Null
          $env:TEMP = $work; $env:TMP = $work
          $out = "$work\out.txt"; $err = "$work\err.txt"
          $p = Start-Process -FilePath $env:TEST_EXE `
            -ArgumentList "serve::", "--test-threads=1", "--nocapture" `
            -Credential $cred -LoadUserProfile -WorkingDirectory $work `
            -RedirectStandardOutput $out -RedirectStandardError $err -Wait -PassThru
          $stdout = Get-Content -Raw $out; $stderr = Get-Content -Raw $err
          Write-Host "--- stdout ---"; Write-Host $stdout
          Write-Host "--- stderr ---"; Write-Host $stderr
          if ($p.ExitCode -ne 0) { throw "tests failed as a standard user (exit $($p.ExitCode))" }
          if (-not "$stdout$stderr".Contains("skipped: icacls /setowner failed")) {
            throw "expected the foreign-owner test to skip for a standard user"
          }
          Write-Host "NON-ELEVATED OK: all serve:: tests pass, foreign-owner test skipped"

  probe-linux:
    # Exercises the POSIX ACL tests with setfacl installed, so they run rather
    # than skip.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf acl
      - name: Stub frontend build output
        run: |
          mkdir -p packages/dashboard/dist
          echo '<!doctype html><title>probe</title>' > packages/dashboard/dist/index.html
      - name: Unit tests (serve::)
        working-directory: packages/dashboard/src-tauri
        run: |
          cargo test --locked --lib serve:: -- --test-threads=1 --nocapture 2>&1 | tee test.log
          grep -q "posix_acl_tests::effective_named_user_entry_is_refused ... ok" test.log
          grep -q "posix_acl_tests::named_user_entry_with_an_empty_mask_is_accepted ... ok" test.log
          ! grep -q "setfacl is not installed" test.log
